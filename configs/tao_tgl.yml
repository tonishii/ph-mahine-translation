seed: 42  
save_data: data/training/TAO_TGL/processed
overwrite: False
report_every: 100

src_vocab: data/training/TAO_TGL/processed/experiment.vocab.src  
tgt_vocab: data/training/TAO_TGL/processed/experiment.vocab.tgt  
share_vocab: false 

data:
  corpus_1:
    path_src: data/training/TAO_TGL/train.tao  
    path_tgt: data/training/TAO_TGL/train.tgl  
  valid:
    path_src: data/training/TAO_TGL/valid.tao  
    path_tgt: data/training/TAO_TGL/valid.tgl  

transforms: [onmt_tokenize]
transforms_configs:
  onmt_tokenize:
    src_subword_type: bpe
    tgt_subword_type: bpe

model:
  architecture: transformer
  layers: 2
  heads: 4
  hidden_size: 256
  transformer_ff: 1024

  embeddings:
    word_vec_size: 256
    position_encoding: true
  
training:
  world_size: 1
  gpu_ranks: [0]
  batch_size: 1024
  valid_batch_size: 1024
  batch_size_multiple: 8        
  batch_type: tokens
  optim: adamw
  learning_rate: 1.0
  warmup_steps: 4000
  decay_method: noam
  adam_beta2: 0.998
  max_grad_norm: 5.0
  save_checkpoint_steps: 500
  train_steps: 25000           
  valid_steps: 500
  keep_checkpoint: 6

  accum_count: [1]            
  accum_steps: [0]
  bucket_size: 4096

  dropout_steps: [0]
  dropout: [0.3]
  attention_dropout: [0.1]

  label_smoothing: 0.1

  model_path: data/training/TAO_TGL/model
  
  train_from: data/training/TAO_TGL/model/step_10000

  num_workers: 2
